name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.container }})
    strategy:
      fail-fast: false
      matrix:
        container: [fedora:latest, debian:trixie]
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install dependencies (Fedora)
        if: startsWith(matrix.container, 'fedora')
        run: dnf install -y --setopt=install_weak_deps=False git python3-pyside6
      - name: Install dependencies (Debian)
        if: startsWith(matrix.container, 'debian')
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3-pyside6
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n chrootable-manager
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Demo screenshot
        run: ./chrootables-desktop --demo --screenshot /tmp/chrootables.png

  integration:
    name: integration (root, opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - name: Setup and integration suite
        run: |
          ./chrootable-manager --setup
          tests/integration.sh
