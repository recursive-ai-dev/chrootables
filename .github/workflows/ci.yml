name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.container }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {container: 'fedora:latest', runner: ubuntu-latest, arch: x86_64}
          - {container: 'debian:trixie', runner: ubuntu-latest, arch: x86_64}
          - {container: 'debian:trixie', runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ${{ matrix.container }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install dependencies (Fedora)
        if: startsWith(matrix.container, 'fedora')
        run: dnf install -y --setopt=install_weak_deps=False git python3-pyside6 python3-gobject-base desktop-file-utils rpm-build dpkg
      - name: Install dependencies (Debian)
        if: startsWith(matrix.container, 'debian')
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets python3-pyside6.qttest python3-gi gir1.2-glib-2.0 desktop-file-utils dpkg
      - uses: actions/checkout@v4
      - name: Verify (Fedora)
        if: startsWith(matrix.container, 'fedora')
        run: python3 scripts/check.py --require-desktop-integration
      - name: Verify and build package (Debian)
        if: startsWith(matrix.container, 'debian')
        run: python3 scripts/check.py --require-desktop-integration --build-deb
      - name: Build installable Debian artifact
        if: startsWith(matrix.container, 'debian')
        run: python3 scripts/build-deb.py --output /tmp/chrootables-artifacts
      - name: Verify Debian installation, upgrade and removal
        if: startsWith(matrix.container, 'debian')
        run: |
          apt-get install -y --no-install-recommends /tmp/chrootables-artifacts/chrootables_*_all.deb
          python3 scripts/check-installed.py
          mkdir -p /var/lib/chrootable-manager
          printf retained > /var/lib/chrootable-manager/.package-preservation-check
          python3 scripts/build-deb.py --revision 2 --output /tmp/upgrade
          apt-get install -y --no-install-recommends /tmp/upgrade/chrootables_*_all.deb
          python3 scripts/check-installed.py
          apt-get remove -y chrootables
          test "$(cat /var/lib/chrootable-manager/.package-preservation-check)" = retained
      - name: Build installable RPM artifact
        if: startsWith(matrix.container, 'fedora')
        run: python3 scripts/build-rpm.py --output /tmp/chrootables-artifacts
      - name: Verify RPM installation, upgrade and removal
        if: startsWith(matrix.container, 'fedora')
        run: |
          dnf install -y --setopt=install_weak_deps=False /tmp/chrootables-artifacts/chrootables-*.noarch.rpm
          python3 scripts/check-installed.py
          mkdir -p /var/lib/chrootable-manager
          printf retained > /var/lib/chrootable-manager/.package-preservation-check
          python3 scripts/build-rpm.py --revision 2 --output /tmp/upgrade
          dnf install -y --setopt=install_weak_deps=False /tmp/upgrade/chrootables-*.noarch.rpm
          python3 scripts/check-installed.py
          dnf remove -y chrootables
          test "$(cat /var/lib/chrootable-manager/.package-preservation-check)" = retained
      - name: Upload Debian package and checksum
        if: startsWith(matrix.container, 'debian')
        uses: actions/upload-artifact@v4
        with:
          name: chrootables-debian-${{ matrix.arch }}
          path: |
            /tmp/chrootables-artifacts/*.deb
            /tmp/chrootables-artifacts/*.deb.sha256
          if-no-files-found: error
      - name: Upload RPM package and checksum
        if: startsWith(matrix.container, 'fedora')
        uses: actions/upload-artifact@v4
        with:
          name: chrootables-rpm-${{ matrix.arch }}
          path: |
            /tmp/chrootables-artifacts/*.rpm
            /tmp/chrootables-artifacts/*.rpm.sha256
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }}, bundled Python and Qt)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      options: --privileged
    env:
      QT_QPA_PLATFORM: offscreen
      APPIMAGETOOL: /tmp/appimage-tools/appimagetool-1.9.1-${{ matrix.arch }}.AppImage
      APPIMAGE_RUNTIME_FILE: /tmp/appimage-tools/runtime-${{ matrix.arch }}
      CHROOTABLE_APPIMAGE_RUNTIME: /tmp/appimage-runtime
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Install build and host runtime dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 python3-pyside6.qtwidgets ca-certificates squashfs-tools file libgl1 libegl1 libfontconfig1 libfreetype6 libglib2.0-0t64 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libx11-xcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libatomic1 libstdc++6 libzstd1 fonts-dejavu-core xvfb xauth weston util-linux
      - uses: actions/checkout@v4
      - name: Fetch checksum-pinned AppImage tools
        run: |
          python3 scripts/fetch-build-tools.py --output /tmp/appimage-tools --architecture ${{ matrix.arch }}
          python3 scripts/fetch-appimage-runtime.py --output /tmp/appimage-runtime --architecture ${{ matrix.arch }}
      - name: Verify AppImage artifact contracts
        run: python3 -m unittest discover -s tests -p test_packages.py -v
      - name: Build AppImage twice and verify reproducibility
        run: |
          python3 scripts/build-appimage.py --output /tmp/chrootables-artifacts
          python3 scripts/build-appimage.py --output /tmp/rebuild
          cmp /tmp/chrootables-artifacts/Chrootables-*.AppImage /tmp/rebuild/Chrootables-*.AppImage
      - name: Verify extracted package and portable launcher
        run: |
          cd /tmp
          /tmp/chrootables-artifacts/Chrootables-*.AppImage --appimage-extract
          cd "$GITHUB_WORKSPACE"
          python3 scripts/check-installed.py --prefix /tmp/squashfs-root/usr
          /tmp/chrootables-artifacts/Chrootables-*.AppImage --version
          /tmp/chrootables-artifacts/Chrootables-*.AppImage --demo --screenshot /tmp/appimage-demo.png
          test -s /tmp/appimage-demo.png
      - name: Verify bundled runtime without host Python or Qt
        run: bash scripts/check-portable.sh /tmp/chrootables-artifacts/Chrootables-*.AppImage
      - name: Build and verify host-runtime compatibility variant
        run: |
          python3 scripts/build-appimage.py --host-runtime --output /tmp/chrootables-artifacts
          python3 scripts/build-appimage.py --host-runtime --output /tmp/rebuild
          cmp /tmp/chrootables-artifacts/Chrootables-*-host-runtime.AppImage /tmp/rebuild/Chrootables-*-host-runtime.AppImage
          variant_tmp=$(mktemp -d)
          trap 'rm -rf -- "$variant_tmp"' EXIT
          export TMPDIR="$variant_tmp"
          /tmp/chrootables-artifacts/Chrootables-*-host-runtime.AppImage --version
          /tmp/chrootables-artifacts/Chrootables-*-host-runtime.AppImage --demo --screenshot /tmp/host-runtime-demo.png
          test -s /tmp/host-runtime-demo.png
      - uses: actions/upload-artifact@v4
        with:
          name: chrootables-appimage-${{ matrix.arch }}
          path: |
            /tmp/chrootables-artifacts/*.AppImage
            /tmp/chrootables-artifacts/*.AppImage.sha256
            /tmp/chrootables-artifacts/*runtime-sources*.tar.gz
            /tmp/chrootables-artifacts/*runtime-sources*.tar.gz.sha256
          if-no-files-found: error

  integration:
    name: integration (${{ matrix.arch }}, root, release/manual/tag)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3
      - uses: actions/checkout@v4
      - name: Setup and integration suite
        run: |
          ./chrootable-manager --setup
          tests/integration.sh
          CHROOTABLE_TEST_ARCHIVE=1 tests/integration.sh python
