name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.container }})
    strategy:
      fail-fast: false
      matrix:
        container: [fedora:latest, debian:trixie]
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install dependencies (Fedora)
        if: startsWith(matrix.container, 'fedora')
        run: dnf install -y --setopt=install_weak_deps=False git python3-pyside6 python3-gobject-base desktop-file-utils
      - name: Install dependencies (Debian)
        if: startsWith(matrix.container, 'debian')
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3-pyside6 python3-gi gir1.2-glib-2.0 desktop-file-utils dpkg
      - uses: actions/checkout@v4
      - name: Verify (Fedora)
        if: startsWith(matrix.container, 'fedora')
        run: python3 scripts/check.py --require-desktop-integration
      - name: Verify and build package (Debian)
        if: startsWith(matrix.container, 'debian')
        run: python3 scripts/check.py --require-desktop-integration --build-deb
      - name: Build installable Debian artifact
        if: startsWith(matrix.container, 'debian')
        run: python3 scripts/build-deb.py
      - name: Upload Debian package and checksum
        if: startsWith(matrix.container, 'debian')
        uses: actions/upload-artifact@v4
        with:
          name: chrootables-debian
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  integration:
    name: integration (root, opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - name: Setup and integration suite
        run: |
          ./chrootable-manager --setup
          tests/integration.sh
